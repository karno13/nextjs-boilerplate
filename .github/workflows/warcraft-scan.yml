name: Archiwum Warcraft — darmowy skaner
on:
  schedule:
    # 08:00 / 20:00 Europe/Warsaw; the Site gates DST and deduplicates slots.
    - cron: '0 6,7,18,19 * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      continuation:
        type: string
        default: '0'
      queue_fingerprint:
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'warcraft-scanner/**'
      - '.github/workflows/warcraft-scan.yml'
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: warcraft-scanner
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'karno13/nextjs-boilerplate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Odczyt kontrolny sklepów bez Vercela
        if: github.event_name == 'push'
        run: node warcraft-scanner/run.mjs --probe
      - name: Skanowanie i zapis postępu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIWUM_CONTINUATION: ${{ inputs.continuation || '0' }}
          ARCHIWUM_QUEUE_FINGERPRINT: ${{ inputs.queue_fingerprint || '' }}
          ARCHIWUM_RESUME_SAVED_QUEUE: '1'
        run: node warcraft-scanner/run.mjs
