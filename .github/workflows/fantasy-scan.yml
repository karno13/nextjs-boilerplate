name: Archiwum Fantasy — darmowy skaner
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      continuation:
        type: string
        default: '0'
      queue_fingerprint:
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'fantasy-scanner/**'
      - '.github/workflows/fantasy-scan.yml'
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: fantasy-scanner
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'karno13/nextjs-boilerplate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Odczyt kontrolny sklepów bez Vercela
        if: github.event_name == 'push'
        run: node fantasy-scanner/run.mjs --probe
      - name: Odczyt kontrolny siedmiu polskich antykwariatów
        if: github.event_name == 'push'
        run: node fantasy-scanner/run.mjs --probe-polish
      - name: Skanowanie i zapis postępu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIWUM_CONTINUATION: ${{ inputs.continuation || '0' }}
          ARCHIWUM_QUEUE_FINGERPRINT: ${{ inputs.queue_fingerprint || '' }}
          ARCHIWUM_RESUME_SAVED_QUEUE: '1'
        run: node fantasy-scanner/run.mjs
